{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{% static 'img/fav/icon.png' %}" type="image">
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
  <script src="https://code.s3.yandex.net/react/libs/react-18/react.development.js"></script>
  <script src="https://code.s3.yandex.net/react/libs/react-18/react-dom.development.js"></script>
  <script src="https://code.s3.yandex.net/react/libs/react-18/babel.min.js"></script>
  <title>{% block title %}Крафт Производство{% endblock %}</title>
</head>
<body>
  <div class="base_page">
    <header>
      {% include "includes/header.html" %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      {% include "includes/footer.html" %}
    </footer>
  </div>
  <div id="app"></div>
  <script src="{% static 'js/index.js' %}" type="text/babel"></script>
</body>
</html>
